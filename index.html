<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR-JUNKO | เลือกลายเสื้อ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#111;
}

/* HEADER */
.header{
  background:#fff;
  text-align:center;
  padding:22px 15px 16px;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:38px;
  font-weight:800;
  margin:0;
}

.subtitle{
  margin-top:6px;
  font-size:16px;
  color:#555;
}

/* MAIN MENU */
.nav{
  background:#111;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav button{
  border:0;
  background:#111;
  color:#fff;
  font-size:16px;
  padding:16px 22px;
  cursor:pointer;
}

.nav button:hover,
.nav button.active{
  background:#333;
}

/* MEN SUBMENU */
.men-panel{
  display:none;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:15px;
}

.men-panel.show{
  display:block;
}

.men-types{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.men-types button{
  background:#eee;
  border:1px solid #ccc;
  border-radius:8px;
  padding:11px 20px;
  font-size:16px;
  cursor:pointer;
}

.men-types button:hover{
  background:#ddd;
}

/* PATTERN MENU */
.pattern-panel{
  display:none;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.pattern-panel.show{
  display:flex;
}

.pattern-panel button{
  background:#fff;
  border:1px solid #bbb;
  border-radius:20px;
  padding:8px 15px;
  cursor:pointer;
}

/* CONTENT */
.container{
  max-width:1250px;
  margin:auto;
  padding:25px 18px 50px;
}

.section-title{
  text-align:center;
  font-size:27px;
  margin:5px 0 22px;
}

.search-box{
  max-width:500px;
  margin:0 auto 25px;
}

.search-box input{
  width:100%;
  padding:13px 16px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

/* PRODUCT GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  display:block;
  cursor:zoom-in;
}

.code{
  text-align:center;
  padding:12px;
  font-size:17px;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){

  .logo{
    font-size:30px;
  }

  .nav button{
    font-size:14px;
    padding:13px 10px;
    flex:1;
    white-space:nowrap;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .container{
    padding:18px 10px 40px;
  }

  .section-title{
    font-size:22px;
  }
}

/* IMAGE GALLERY */
.lightbox{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.92);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:20px;
  touch-action:pan-y;
}

.lightbox.show{
  display:flex;
}

.lightbox img{
  max-width:95%;
  max-height:82vh;
  object-fit:contain;
  border-radius:6px;
  user-select:none;
  -webkit-user-select:none;
}

.lightbox-code{
  color:#fff;
  font-size:22px;
  font-weight:bold;
  margin-top:12px;
}

.lightbox-close{
  position:absolute;
  top:15px;
  right:22px;
  color:#fff;
  font-size:46px;
  cursor:pointer;
  z-index:10002;
  line-height:1;
}

.lightbox-prev,
.lightbox-next{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:55px;
  width:55px;
  height:80px;
  cursor:pointer;
  z-index:10001;
  border-radius:8px;
}

.lightbox-prev{
  left:10px;
}

.lightbox-next{
  right:10px;
}

@media(max-width:650px){

  .lightbox{
    padding:10px;
  }

  .lightbox img{
    max-width:100%;
    max-height:80vh;
  }

  .lightbox-prev,
  .lightbox-next{
    font-size:42px;
    width:44px;
    height:65px;
  }

  .lightbox-prev{
    left:3px;
  }

  .lightbox-next{
    right:3px;
  }
}

</style>

<script>

let currentType = "";


/* HIDE PRODUCTS */
function hideAll(){

  document
    .querySelectorAll(".product")
    .forEach(p=>{

      p.style.display="none";

    });

}


/* ACTIVE MAIN MENU */
function setActive(btn){

  document
    .querySelectorAll(".nav button")
    .forEach(b=>{

      b.classList.remove("active");

    });

  if(btn){
    btn.classList.add("active");
  }

}


/* MAIN CATEGORY */
function showCategory(category,btn){

  document
    .getElementById("menPanel")
    .classList.remove("show");

  setActive(btn);

  hideAll();

  const title =
    document.getElementById("sectionTitle");


  if(category==="new"){

    title.textContent =
      "🆕 ลายใหม่ล่าสุด";

    document
      .querySelectorAll(".product")
      .forEach(p=>{

        if(
          p.dataset.category.includes("new")
        ){
          p.style.display="block";
        }

      });

  }


  if(category==="women"){

    title.textContent =
      "👚 เสื้อผู้หญิง";

    document
      .querySelectorAll(".product")
      .forEach(p=>{

        if(
          p.dataset.category.includes("women")
        ){
          p.style.display="block";
        }

      });

  }


  if(category==="kids"){

    title.textContent =
      "🧒 เสื้อเด็ก";

    document
      .querySelectorAll(".product")
      .forEach(p=>{

        if(
          p.dataset.category.includes("kids")
        ){
          p.style.display="block";
        }

      });

  }

}


/* MEN */
function toggleMen(btn){

  setActive(btn);

  const panel =
    document.getElementById("menPanel");

  panel.classList.toggle("show");

  document
    .getElementById("sectionTitle")
    .textContent =
      "👔 เสื้อผู้ชาย";

  hideAll();

  document
    .querySelectorAll(".product")
    .forEach(p=>{

      if(
        p.dataset.category.includes("men")
      ){
        p.style.display="block";
      }

    });

}


/* MEN TYPE */
function showMenType(type){

  currentType=type;

  document
    .getElementById("shirtPatterns")
    .classList.remove("show");

  document
    .getElementById("tshirtPatterns")
    .classList.remove("show");

  document
    .getElementById("setPatterns")
    .classList.remove("show");


  if(type==="shirt"){

    document
      .getElementById("shirtPatterns")
      .classList.add("show");

    document
      .getElementById("sectionTitle")
      .textContent =
        "👔 เสื้อเชิ้ตผู้ชาย";

  }


  if(type==="tshirt"){

    document
      .getElementById("tshirtPatterns")
      .classList.add("show");

    document
      .getElementById("sectionTitle")
      .textContent =
        "👕 เสื้อคอกลมผู้ชาย";

  }


  if(type==="set"){

    document
      .getElementById("setPatterns")
      .classList.add("show");

    document
      .getElementById("sectionTitle")
      .textContent =
        "👔➕🩳 ชุดเสื้อ+กางเกงผู้ชาย";

  }


  hideAll();


  document
    .querySelectorAll(".product")
    .forEach(p=>{

      if(
        p.dataset.type===type
      ){
        p.style.display="block";
      }

    });

}


/* PATTERN FILTER */
function filterPattern(pattern){

  hideAll();

  document
    .querySelectorAll(".product")
    .forEach(p=>{

      if(
        p.dataset.type===currentType &&
        p.dataset.pattern===pattern
      ){
        p.style.display="block";
      }

    });

}


/* SEARCH */
function searchProducts(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .replace(/\s/g,"");


  if(text===""){

    document
      .querySelectorAll(".product")
      .forEach(p=>{

        p.style.display="block";

      });

    return;

  }


  document
    .querySelectorAll(".product")
    .forEach(p=>{

      const code =
        p.querySelector(".code")
        .textContent
        .toLowerCase();

      const cleanCode =
        code.replace("n-","");


      if(
        code.includes(text) ||
        cleanCode.includes(
          text.replace("n-","")
        )
      ){

        p.style.display="block";

      }else{

        p.style.display="none";

      }

    });

}


/* =========================
   IMAGE GALLERY
========================= */

let galleryProducts = [];
let currentImageIndex = 0;

let touchStartX = 0;
let touchEndX = 0;


/* GET ONLY VISIBLE PRODUCTS */
function getVisibleProducts(){

  return Array
    .from(
      document.querySelectorAll(".product")
    )
    .filter(p=>{

      return (
        window
          .getComputedStyle(p)
          .display !== "none"
      );

    });

}


/* OPEN IMAGE */
function openLightbox(product){

  galleryProducts =
    getVisibleProducts();

  currentImageIndex =
    galleryProducts.indexOf(product);


  if(currentImageIndex < 0){

    galleryProducts=[product];

    currentImageIndex=0;

  }


  showGalleryImage();


  document
    .getElementById("lightbox")
    .classList.add("show");


  document.body.style.overflow="hidden";

}


/* SHOW CURRENT IMAGE */
function showGalleryImage(){

  const product =
    galleryProducts[currentImageIndex];

  if(!product){
    return;
  }


  const img =
    product.querySelector("img");

  const code =
    product
      .querySelector(".code")
      .textContent;


  document
    .getElementById("lightboxImage")
    .src =
      img.src;


  document
    .getElementById("lightboxImage")
    .alt =
      code;


  document
    .getElementById("lightboxCode")
    .textContent =
      code;

}


/* NEXT / PREVIOUS */
function changeImage(direction){

  if(
    galleryProducts.length <= 1
  ){
    return;
  }


  currentImageIndex += direction;


  if(
    currentImageIndex >=
    galleryProducts.length
  ){

    currentImageIndex=0;

  }


  if(
    currentImageIndex < 0
  ){

    currentImageIndex =
      galleryProducts.length - 1;

  }


  showGalleryImage();

}


/* CLOSE IMAGE */
function closeLightbox(){

  document
    .getElementById("lightbox")
    .classList.remove("show");

  document.body.style.overflow="";

}


/* CLICK PRODUCT IMAGE */
document
  .querySelectorAll(".product img")
  .forEach(img=>{

    img.addEventListener(
      "click",
      function(e){

        e.stopPropagation();

        openLightbox(
          this.closest(".product")
        );

      }
    );

  });


const lightbox =
  document.getElementById("lightbox");


/* CLICK BLACK BACKGROUND TO CLOSE */
lightbox.addEventListener(
  "click",
  function(e){

    if(e.target===lightbox){
      closeLightbox();
    }

  }
);


/* MOBILE SWIPE */
lightbox.addEventListener(
  "touchstart",
  function(e){

    touchStartX =
      e.changedTouches[0].screenX;

  },
  {passive:true}
);


lightbox.addEventListener(
  "touchend",
  function(e){

    touchEndX =
      e.changedTouches[0].screenX;


    const distance =
      touchEndX - touchStartX;


    if(
      Math.abs(distance) < 50
    ){
      return;
    }


    /* SWIPE LEFT */
    if(distance < 0){

      changeImage(1);

    }

    /* SWIPE RIGHT */
    else{

      changeImage(-1);

    }

  },
  {passive:true}
);


/* KEYBOARD */
document.addEventListener(
  "keydown",
  function(e){

    if(
      !lightbox
        .classList
        .contains("show")
    ){
      return;
    }


    if(e.key==="ArrowRight"){

      changeImage(1);

    }


    if(e.key==="ArrowLeft"){

      changeImage(-1);

    }


    if(e.key==="Escape"){

      closeLightbox();

    }

  }
);

</script>
