<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR-JUNKO | เลือกลายเสื้อ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#111;
}

/* HEADER */
.header{
  background:#fff;
  text-align:center;
  padding:22px 15px 16px;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:38px;
  font-weight:800;
  margin:0;
}

.subtitle{
  margin-top:6px;
  font-size:16px;
  color:#555;
}

/* MAIN MENU */
.nav{
  background:#111;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav button{
  border:0;
  background:#111;
  color:#fff;
  font-size:16px;
  padding:16px 22px;
  cursor:pointer;
}

.nav button:hover,
.nav button.active{
  background:#333;
}

/* MEN SUBMENU */
.men-panel{
  display:none;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:15px;
}

.men-panel.show{
  display:block;
}

.men-types{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.men-types button{
  background:#eee;
  border:1px solid #ccc;
  border-radius:8px;
  padding:11px 20px;
  font-size:16px;
  cursor:pointer;
}

.men-types button:hover{
  background:#ddd;
}

/* PATTERN MENU */
.pattern-panel{
  display:none;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.pattern-panel.show{
  display:flex;
}

.pattern-panel button{
  background:#fff;
  border:1px solid #bbb;
  border-radius:20px;
  padding:8px 15px;
  cursor:pointer;
}

/* CONTENT */
.container{
  max-width:1250px;
  margin:auto;
  padding:25px 18px 50px;
}

.section-title{
  text-align:center;
  font-size:27px;
  margin:5px 0 22px;
}

.search-box{
  max-width:500px;
  margin:0 auto 25px;
}

.search-box input{
  width:100%;
  padding:13px 16px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

/* PRODUCT GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.product{
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  display:block;
}

.code{
  text-align:center;
  padding:12px;
  font-size:17px;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .logo{
    font-size:30px;
  }

  .nav button{
    font-size:14px;
    padding:13px 10px;
    flex:1;
    white-space:nowrap;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .container{
    padding:18px 10px 40px;
  }

  .section-title{
    font-size:22px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1 class="logo">MR-JUNKO</h1>
  <div class="subtitle">สินค้าไทย ผลิตในประเทศไทย</div>
</header>

<nav class="nav">
  <button onclick="showCategory('new',this)" class="active">🆕 ลายใหม่ล่าสุด</button>
  <button onclick="toggleMen(this)">👔 ผู้ชาย ▼</button>
  <button onclick="showCategory('women',this)">👚 ผู้หญิง</button>
  <button onclick="showCategory('kids',this)">🧒 เด็ก</button>
</nav>

<div id="menPanel" class="men-panel">

  <div class="men-types">
    <button onclick="showMenType('shirt')">👔 เสื้อเชิ้ต</button>
    <button onclick="showMenType('tshirt')">👕 เสื้อคอกลม</button>
  </div>

  <div id="shirtPatterns" class="pattern-panel">
    <button onclick="filterPattern('fish')">🐟 ลายปลา</button>
    <button onclick="filterPattern('tiger')">🐯 ลายเสือ</button>
    <button onclick="filterPattern('dragon')">🐉 ลายมังกร</button>
    <button onclick="filterPattern('japanese')">🌸 ลายญี่ปุ่น</button>
    <button onclick="filterPattern('baroque')">✨ ลายหลุยส์</button>
    <button onclick="filterPattern('other')">ลายอื่นๆ</button>
  </div>

  <div id="tshirtPatterns" class="pattern-panel">
    <button onclick="filterPattern('fish')">🐟 ลายปลา</button>
    <button onclick="filterPattern('tiger')">🐯 ลายเสือ</button>
    <button onclick="filterPattern('dragon')">🐉 ลายมังกร</button>
    <button onclick="filterPattern('other')">ลายอื่นๆ</button>
  </div>

</div>

<main class="container">

  <h2 id="sectionTitle" class="section-title">🆕 ลายใหม่ล่าสุด</h2>

  <div class="search-box">
    <input
      id="search"
      type="text"
      placeholder="🔎 ค้นหารหัสสินค้า เช่น N-4056 หรือ 4056"
      oninput="searchProducts()">
  </div>

  <div id="products" class="grid">

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-3919.jpg" alt="N-3919">

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">

    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-3989.jpg" alt="N-3989">
      <div class="code">N-3989</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-3992.jpg" alt="N-3992">
      <div class="code">N-3992</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="japanese">

      <img src="N-3995.jpg" alt="N-3995">
      <div class="code">N-3995</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="baroque">
      <img src="N-3997.jpg" alt="N-3997">
      <div class="code">N-3997</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-4006.jpg" alt="N-4006">
      <div class="code">N-4006</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-4009.jpg" alt="N-4009">
      <div class="code">N-4009</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="japanese">
      <img src="N-4035.jpg" alt="N-4035">
      <div class="code">N-4035</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-4040.jpg" alt="N-4040">
      <div class="code">N-4040</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-4056.jpg" alt="N-4056">
      <div class="code">N-4056</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="other">
      <img src="N-4073.jpg" alt="N-4073">

    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="baroque">
      <img src="N-4078.jpg" alt="N-4078">

    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="baroque">

    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="baroque">
      <img src="N-4108.jpg" alt="N-4108">

    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="tiger">
      <img src="N-4119.jpg" alt="N-4119">
      <div class="code">N-4119</div>
    </div>

    <div class="product" data-category="men new" data-type="shirt" data-pattern="baroque">
      <img src="N-4142.jpg" alt="N-4142">
      <div class="code">N-4142</div>
    </div>

  </div>
</main>

<script>
let currentType = "";

function hideAll(){
  document.querySelectorAll(".product").forEach(p=>{
    p.style.display="none";
  });
}

function setActive(btn){
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });

  if(btn) btn.classList.add("active");
}

function showCategory(category,btn){

  document.getElementById("menPanel").classList.remove("show");

  setActive(btn);

  hideAll();

  const title=document.getElementById("sectionTitle");

  if(category==="new"){
    title.textContent="🆕 ลายใหม่ล่าสุด";

    document.querySelectorAll(".product").forEach(p=>{
      if(p.dataset.category.includes("new")){
        p.style.display="block";
      }
    });
  }

  if(category==="women"){
    title.textContent="👚 เสื้อผู้หญิง";

    document.querySelectorAll(".product").forEach(p=>{
      if(p.dataset.category.includes("women")){
        p.style.display="block";
      }
    });
  }

  if(category==="kids"){
    title.textContent="🧒 เสื้อเด็ก";

    document.querySelectorAll(".product").forEach(p=>{
      if(p.dataset.category.includes("kids")){
        p.style.display="block";
      }
    });
  }
}

function toggleMen(btn){

  setActive(btn);

  const panel=document.getElementById("menPanel");
  panel.classList.toggle("show");

  document.getElementById("sectionTitle").textContent="👔 เสื้อผู้ชาย";

  hideAll();

  document.querySelectorAll(".product").forEach(p=>{
    if(p.dataset.category.includes("men")){
      p.style.display="block";
    }
  });
}

function showMenType(type){

  currentType=type;

  document.getElementById("shirtPatterns").classList.remove("show");
  document.getElementById("tshirtPatterns").classList.remove("show");

  if(type==="shirt"){
    document.getElementById("shirtPatterns").classList.add("show");
    document.getElementById("sectionTitle").textContent="👔 เสื้อเชิ้ตผู้ชาย";
  }

  if(type==="tshirt"){
    document.getElementById("tshirtPatterns").classList.add("show");
    document.getElementById("sectionTitle").textContent="👕 เสื้อคอกลมผู้ชาย";
  }

  hideAll();

  document.querySelectorAll(".product").forEach(p=>{
    if(p.dataset.type===type){
      p.style.display="block";
    }
  });
}

function filterPattern(pattern){

  hideAll();

  document.querySelectorAll(".product").forEach(p=>{
    if(
      p.dataset.type===currentType &&
      p.dataset.pattern===pattern
    ){
      p.style.display="block";
    }
  });
}

function searchProducts(){

  const text=document.getElementById("search").value
    .toLowerCase()
    .replace(/\s/g,"");

  if(text===""){
    document.querySelectorAll(".product").forEach(p=>{
      p.style.display="block";
    });
    return;
  }

  document.querySelectorAll(".product").forEach(p=>{

    const code=p.querySelector(".code")
      .textContent
      .toLowerCase();

    const cleanCode=code.replace("n-","");

    if(code.includes(text) || cleanCode.includes(text.replace("n-",""))){
      p.style.display="block";
    }else{
      p.style.display="none";
    }
  });
}
</script>

</body>
</html>
